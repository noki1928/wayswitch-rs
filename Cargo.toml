[package]
name = "wayswitch-rs"
version = "0.1.0"
edition = "2021"
description = "Автоисправление русско-английской раскладки на Wayland (порт WaySwitch на Rust с защитой паролей)"
license = "MIT AND CC-BY-SA-4.0"
rust-version = "1.82"

[[bin]]
name = "wayswitch-rs"
path = "src/main.rs"

[dependencies]
evdev = "0.12"
xkbcommon = { version = "0.8", default-features = false }
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
flate2 = "1"
zeroize = { version = "1", features = ["zeroize_derive"] }
hmac = "0.12"
sha2 = "0.10"
getrandom = "0.2"
libc = "0.2"
inotify = { version = "0.11", default-features = false }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
