name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev shellcheck
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: shellcheck packaging/install.sh packaging/uninstall.sh
